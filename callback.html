<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>financer · Back from your bank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
/* Layout: one narrow reading column, two sections (#privacy, #terms) with a small jump bar. Archivo, financer's own face. */
:root {
  --bg: #f3f2f2;
  --fg: #201e1d;
  --muted: #5f5b5a;
  --line: rgba(32, 30, 29, .16);
  --accent: #ae1800;
  --font: Archivo, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #151414; --fg: #f0eeee; --muted: #a9a4a3; --line: rgba(240, 238, 238, .16); --accent: #ff8a75; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #151414; --fg: #f0eeee; --muted: #a9a4a3; --line: rgba(240, 238, 238, .16); --accent: #ff8a75; color-scheme: dark; }

body { background: var(--bg); color: var(--fg); font: 16px/1.6 var(--font); }
.wrap { max-width: 42rem; margin: 0 auto; padding-block: 40px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 40px; }
header { display: grid; gap: 8px; }
h1 { font-size: 2rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin: 0; text-wrap: balance; }
.meta { color: var(--muted); font-size: .875rem; margin: 0; }
nav { display: flex; gap: 20px; flex-wrap: wrap; font-weight: 600; font-size: .9375rem; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
section { display: grid; gap: 12px; border-top: 2px solid var(--fg); padding-top: 20px; }
h2 { font-size: 1.375rem; font-weight: 800; letter-spacing: -.02em; margin: 0; }
h3 { font-size: 1rem; font-weight: 800; margin: 12px 0 0; }
p, ul { margin: 0; }
ul { padding-left: 1.2em; display: grid; gap: 6px; }
.note { color: var(--muted); font-size: .875rem; border-top: 1px solid var(--line); padding-top: 12px; }

html { margin: 0; }
body { margin: 0; }
.callback { display: grid; gap: 12px; }
code { font-family: ui-monospace, Menlo, monospace; font-size: .875rem; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>financer · Back from your bank</h1>
    <p class="meta">As of 20.10.2026 · applies to the financer application registered with Enable Banking</p>
    
  </header>
  <section class="callback" aria-live="polite">
    <p id="status">Taking you back to financer…</p>
    <p id="manual" hidden>If financer didn't open, copy this address into the browser on the device that runs financer:<br><code id="target"></code></p>
  </section>
</div>
<script>
// The bank sends the browser here (Enable Banking redirect URL; it must be https).
// financer put its own callback address into `state`: "<random>.<base64url of the address>".
// This page forwards ?code= (or ?error=) and state there. It only forwards to an
// address whose path ends in /accounts/enable-banking/callback.
(function () {
  var params = new URLSearchParams(location.search);
  var state = params.get("state") || "";
  var status = document.getElementById("status");
  var target = "";
  try {
    var b64 = state.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    var url = new URL(atob(b64 + "===".slice((b64.length + 3) % 4)));
    if ((url.protocol === "http:" || url.protocol === "https:") && /\/accounts\/enable-banking\/callback$/.test(url.pathname)) {
      params.forEach(function (v, k) { url.searchParams.set(k, v); });
      target = url.toString();
    }
  } catch (e) {}
  if (!target) {
    status.textContent = "This page only forwards an answer from your bank to financer, and this address carries none.";
    return;
  }
  document.getElementById("target").textContent = target;
  document.getElementById("manual").hidden = false;
  location.replace(target);
})();
</script>
</body>
</html>
